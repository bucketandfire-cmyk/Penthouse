<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penthouse Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#050505;--surface:#0d0d0d;--surface2:#161616;--ink:#f4f4f4;--muted:#a6a6a6;--line:rgba(255,255,255,.18);--g:#ffffff;--on:#000000;--amber:#ffb84d;--blue:#7fb2ff;--red:#ff6b6b;
--head:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Inter Tight","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 80% 40% at 50% 0,rgba(255,255,255,.09),transparent 70%),var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 10px}
header b{font:800 22px var(--head);letter-spacing:-.02em}
header nav{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
header nav a{text-decoration:none}header nav a:hover{color:var(--ink)}
.status{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted);background:rgba(24,24,24,.6)}
.chip b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--muted);font:600 15px var(--body);padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button{transition:color .15s,text-shadow .15s}
.tabs button:hover,.tabs button:focus-visible{color:var(--g);text-shadow:0 0 12px rgba(57,255,106,.75),0 0 28px rgba(57,255,106,.35)}
.tabs button[aria-selected=true]{color:var(--g);border-bottom-color:var(--g)}
main{padding:20px 0 60px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.controls label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
input[type=number]{width:80px}input[type=search]{width:170px}
.note{border:1px solid rgba(255,184,77,.35);background:rgba(255,184,77,.07);color:#ffd9a0;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.empty,.err{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line);border-radius:16px}
.err{color:#ffb3b3;border-color:rgba(255,107,107,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0;font:700 20px var(--head);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font:600 12px var(--body);padding:2px 10px;border-radius:999px;border:1px solid currentColor}
.s-emerging{color:var(--g)}.s-hot{color:var(--amber)}.s-cooling{color:var(--blue)}.s-steady,.s-faded,.s-unrated,.s-candidate,.s-any{color:var(--muted)}.s-active{color:var(--g)}.s-benched{color:var(--amber)}.s-retired{color:var(--red)}
.big{font:700 28px var(--head);margin:8px 0 0}
.sub{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--surface2);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--surface2);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted)}
h2{font:700 18px var(--head);margin:26px 0 12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.08)}
th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;user-select:none}
th[aria-sort]::after{content:attr(data-arrow);color:var(--g);margin-left:4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.05)}
td a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pos{color:var(--g)}.neg{color:var(--red)}
.badge{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px}
.badge.ok{color:var(--g)}.badge.warn{color:var(--amber);border-color:rgba(255,184,77,.4)}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ev time{color:var(--muted);min-width:78px;font-size:13px}
.addform{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.addform input[name=address]{flex:2 1 300px;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.addform input[name=label]{flex:1 1 150px;min-width:0}
.addform .btn{padding:9px 22px;font-size:15px}
.msg{min-height:1.4em;margin:8px 0 0;font-size:14px;color:var(--muted)}
.msg.bad{color:#ffb3b3}
.mine .addr{margin:2px 0 8px}
.mine .small{font-size:12.5px}
.mine details{margin-top:12px;border-top:1px solid rgba(255,255,255,.12);padding-top:8px}
.mine summary{cursor:pointer;color:var(--muted);font-size:13px}
.mine .tr{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.mine .tr .t{margin-left:auto;color:var(--muted)}
.side-buy{color:var(--g)}.side-sell{color:var(--red)}
.xbtn{margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 14px;font:600 13px var(--body);cursor:pointer}
.xbtn:hover,.xbtn.sure{color:var(--red);border-color:rgba(255,107,107,.5)}
.av{display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);border-radius:var(--r,10px);background:linear-gradient(135deg,hsl(var(--hue) 55% 30%),hsl(calc(var(--hue) + 50) 55% 16%));color:hsl(var(--hue) 85% 82%);font:700 calc(var(--s,32px) * .38)/1 var(--head);overflow:hidden;flex:none;vertical-align:middle;text-transform:uppercase}
.av.round{--r:50%}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who2{display:inline-flex;gap:5px;align-items:center;vertical-align:middle}
.toast .coin{margin-top:1px}
.mine h3 .lbl{display:flex;gap:10px;align-items:center;min-width:0}
.mine h3 .lbl span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo .xbtn{margin-top:0;padding:4px 12px;font-size:12.5px}
.photo input[type=file]{display:none}
.pingwrap{position:relative;display:inline-block;margin-right:14px}
.pingbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;font:600 13px var(--body);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.pingbtn:hover,.pingbtn[aria-expanded=true]{color:var(--g);border-color:var(--g);box-shadow:0 0 14px rgba(57,255,106,.4)}
.pingbtn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pingbtn.on i{background:var(--g);box-shadow:0 0 8px var(--g)}
.pingpop{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 24px));background:rgba(12,12,12,.98);border:1px solid var(--line);border-radius:14px;padding:14px;z-index:45;box-shadow:0 8px 40px rgba(0,0,0,.6);text-align:left}
.pingpop[hidden]{display:none}
.pingpop label{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0;color:var(--ink)}
.pingpop input{accent-color:var(--g)}
.pingpop h4{margin:12px 0 6px;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pingpop .rec{max-height:200px;overflow-y:auto;font-size:13px}
.pingpop .rec b{font:600 13px var(--body);color:var(--ink)}
.pk-buy{color:var(--g)}.pk-sell{color:var(--red)}.pk-launch{color:var(--amber)}
.pingpop .rec div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);color:var(--muted)}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:rgba(12,12,12,.96);border:1px solid var(--line);border-left:3px solid var(--g);border-radius:12px;padding:10px 10px 10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;box-shadow:0 0 24px rgba(255,255,255,.18);animation:tin .25s ease-out}
.toast.k-launch{border-left-color:var(--amber)}.toast.k-sell{border-left-color:var(--red)}
.toast .tg{display:block;font:700 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--g);margin-bottom:1px}
.toast.k-launch .tg{color:var(--amber)}.toast.k-sell .tg{color:var(--red)}
.toast a{text-decoration:underline;text-underline-offset:2px}
.toast .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.toast .x:hover{color:var(--ink)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.gate{margin:12vh auto;text-align:center;max-width:380px;color:var(--muted)}
.gate h1{font:800 32px var(--head);color:var(--ink);margin:0 0 8px}
.btn{display:inline-block;background:var(--g);color:var(--on);font-weight:600;padding:12px 24px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;font:600 16px var(--body)}
.pay{max-width:560px;margin:5vh auto 0}
.pay h1{font:800 34px var(--head);margin:0 0 6px;letter-spacing:-.02em}
.pay ul{padding-left:20px;color:var(--muted);margin:14px 0}
.pay li{margin:4px 0}.pay li b{color:var(--ink);font-weight:600}
.seg{display:flex;gap:8px;margin:18px 0 14px}
.seg button{flex:1;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:12px;font:600 15px var(--body);cursor:pointer}
.seg button[aria-pressed=true]{color:var(--on);background:var(--g);border-color:var(--g)}
.btn.block{display:block;width:100%;text-align:center}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.inv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.inv .amt{font:700 30px var(--head);word-break:break-all;margin:2px 0 8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all;color:var(--ink)}
.copy{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:600 13px var(--body);cursor:pointer;flex:none}
.qr{display:flex;justify-content:center;margin:14px 0}
.qr img{width:190px;height:190px;border-radius:12px;background:#fff;padding:8px;image-rendering:pixelated}
.wait{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);margin-top:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 0 28px}
@media (max-width:600px){.tabs{flex-wrap:wrap;overflow:visible;gap:2px}.tabs button{padding:10px 12px;font-size:14px}.wrap{padding:0 12px}.controls label{flex:1 1 45%}input[type=search]{width:100%}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* black & white theme: green is reserved for the hover glow */
.btn,button,.card.social{transition:box-shadow .15s,border-color .15s,color .15s,text-shadow .15s}
.btn:hover,.btn:focus-visible,button:hover,button:focus-visible{box-shadow:0 0 18px rgba(57,255,106,.9),0 0 42px rgba(57,255,106,.5)}
.tabs button:hover,.tabs button:focus-visible{box-shadow:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><a href="/" aria-label="Penthouse home" style="display:flex;align-items:center"><img src="/logo-spin.webp" alt="Penthouse" width="62" height="44" style="display:block;height:44px;width:auto"></a><nav><span id="who"></span></nav></header>
  <div class="status" id="status"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="panels"></main>
  <footer>Information, not financial advice. Wallet results are past performance; memecoins are high risk and most go to zero.</footer>
</div>
<script>
// ---------- helpers (all dynamic text goes through textContent, never innerHTML) ----------
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v != null) e.setAttribute(k, v); }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const B58 = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { Accept: 'application/json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  let d = {}; try { d = await r.json(); } catch {}
  if (r.status === 401 || r.status === 402 || r.status === 403) throw { auth: r.status, msg: d.error };
  if (!r.ok || d.error) throw { msg: d.error || 'Something went wrong. Try again.' };
  return d;
};
const num = (x, d = 0) => (x == null ? '–' : Number(x).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d }));
const money = (x) => x == null ? '–' : x >= 1e9 ? `$${(x / 1e9).toFixed(1)}B` : x >= 1e6 ? `$${(x / 1e6).toFixed(1)}M` : x >= 1e3 ? `$${(x / 1e3).toFixed(0)}K` : `$${Math.round(x)}`;
const pct = (x) => (x == null ? '–' : `${Math.round(x * 100)}%`);
const ago = (ts) => { if (!ts) return 'never'; const s = Date.now() / 1000 - ts; if (s < 90) return 'just now'; if (s < 5400) return `${Math.round(s / 60)}m ago`; if (s < 129600) return `${Math.round(s / 3600)}h ago`; return `${Math.round(s / 86400)}d ago`; };
const day = (ts) => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '–';
const mins = (m) => m == null ? '–' : m < 1 ? `${Math.round(m * 60)}s` : m < 90 ? `${num(m, 1)}m` : `${num(m / 60, 1)}h`;
const solscan = (a, label) => B58.test(a || '') ? h('a', { href: `https://solscan.io/account/${a}`, target: '_blank', rel: 'noopener noreferrer' }, label) : label;
const COIN_SITES = [
  ['DexScreener', (m) => `https://dexscreener.com/solana/${m}`],
  ['Pump.fun', (m) => `https://pump.fun/coin/${m}`],
  ['Axiom', (m) => `https://axiom.trade/t/${m}`],
  ['Fomo', (m) => `https://fomo.family/t/${m}`],
];
let coinMenu = null;
const closeCoinMenu = () => { if (coinMenu) { coinMenu.remove(); coinMenu = null; } };
document.addEventListener('click', closeCoinMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCoinMenu(); });
window.addEventListener('scroll', closeCoinMenu, true);
(() => { const st = document.createElement('style'); st.textContent = '.coinmenu{position:fixed;z-index:60;min-width:180px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.6)}.coinmenu .ct{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}.coinmenu a,.coinmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none}.coinmenu a:hover,.coinmenu button:hover{background:rgba(255,255,255,.1)}'; document.head.append(st); })();
const dex = (m, label) => {
  if (!B58.test(m || '')) return label;
  return h('a', { href: COIN_SITES[0][1](m), target: '_blank', rel: 'noopener noreferrer', title: 'Open coin in…', onclick: (e) => {
    e.preventDefault(); e.stopPropagation(); closeCoinMenu();
    const r = e.currentTarget.getBoundingClientRect();
    const copy = h('button', { type: 'button', onclick: () => { try { navigator.clipboard.writeText(m); copy.textContent = 'Copied'; } catch { copy.textContent = m; } } }, 'Copy address');
    coinMenu = h('div', { class: 'coinmenu', onclick: (ev) => ev.stopPropagation() },
      h('div', { class: 'ct' }, 'Open with'),
      COIN_SITES.map(([n, f]) => h('a', { href: f(m), target: '_blank', rel: 'noopener noreferrer', onclick: () => setTimeout(closeCoinMenu, 0) }, n)),
      copy);
    document.body.append(coinMenu);
    const w = coinMenu.offsetWidth, ht = coinMenu.offsetHeight;
    coinMenu.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    coinMenu.style.top = (r.bottom + ht + 8 > innerHeight ? Math.max(8, r.top - ht - 4) : r.bottom + 4) + 'px';
  } }, label);
};
const pill = (s) => h('span', { class: `pill s-${s}` }, s);
const hue = (str) => { let x = 0; for (const c of String(str)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 360; };
const pfpSrc = (a, v) => (v ? (window.__pfpSrc?.(a) || `/api/pfp/${encodeURIComponent(a)}?v=${v}`) : null);
// Picture with a coloured-letters fallback (used until the image loads, or if it never does)
function av(src, text, seed, size = 32, round = false) {
  const e = h('span', { class: `av${round ? ' round' : ''}`, style: `--s:${size}px;--hue:${hue(seed)}` }, String(text || '?').replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2) || '?');
  if (typeof src === 'string' && (src.startsWith('/') || src.startsWith('https://') || src.startsWith('data:image/'))) {
    const img = h('img', { alt: '', referrerpolicy: 'no-referrer', decoding: 'async' });
    img.onload = () => e.replaceChildren(img);
    img.src = src;
  }
  return e;
}
const empty = (msg) => h('div', { class: 'empty' }, msg);
const sign = (x, d = 1) => h('span', { class: x > 0 ? 'pos' : x < 0 ? 'neg' : '' }, x == null ? '–' : `${x > 0 ? '+' : ''}${num(x, d)}`);

// sortable table: cols = [{ k, label, n: numeric, cell: (row) => node|string, sort: (row) => value }]
function table(cols, rows, state) {
  state.key ??= cols.find((c) => c.def)?.k; state.desc ??= true;
  const col = cols.find((c) => c.k === state.key);
  const sorted = [...rows];
  if (col) sorted.sort((a, b) => { const x = (col.sort || ((r) => r[col.k]))(a), y = (col.sort || ((r) => r[col.k]))(b);
    return ((x ?? -Infinity) > (y ?? -Infinity) ? 1 : (x ?? -Infinity) < (y ?? -Infinity) ? -1 : 0) * (state.desc ? -1 : 1); });
  const head = h('tr', {}, cols.map((c) => {
    const th = h('th', { class: c.n ? 'n' : '', scope: 'col', tabindex: 0, role: 'button' }, c.label);
    if (c.k === state.key) { th.setAttribute('aria-sort', state.desc ? 'descending' : 'ascending'); th.dataset.arrow = state.desc ? '▼' : '▲'; }
    const go = () => { state.desc = state.key === c.k ? !state.desc : true; state.key = c.k; state.redraw(); };
    th.onclick = go; th.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    return th;
  }));
  return h('div', { class: 'tw' }, h('table', {}, h('thead', {}, head),
    h('tbody', {}, sorted.map((r) => h('tr', {}, cols.map((c) => h('td', { class: c.n ? 'n' : '' }, c.cell ? c.cell(r) : r[c.k])))))));
}

// ---------- tabs ----------
const TABS = [];
function tab(id, label, build) { TABS.push({ id, label, build }); }

tab('metas', 'Metas', (body) => {
  return async () => {
    const d = await api('/api/dash/metas');
    const kids = [];
    if (!d.ratings_reliable) kids.push(h('div', { class: 'note' }, `Trend ratings unlock after 14 days of history (${d.days_of_history ?? 0} so far). Until then this shows activity only.`));
    const card = (r, labeled) => h('div', { class: 'card' },
      h('h3', {}, r.key, pill(r.status)),
      h('div', { class: 'big' }, `${r.launches_this_week} launches`),

const tabsEl = document.getElementById('tabs'), panels = document.getElementById('panels');
let current = null;
function select(id) {
  for (const t of TABS) { t.btn.setAttribute('aria-selected', String(t.id === id)); t.btn.tabIndex = t.id === id ? 0 : -1; t.panel.hidden = t.id !== id; }
  current = TABS.find((t) => t.id === id);
  history.replaceState(null, '', `#${id}`);
  refresh(current);
}
async function refresh(t) {
  if (!t.refresh) t.refresh = t.build(t.panel);
  try { await t.refresh(); }
  catch (e) {
    if (e.auth) return e.auth === 402 ? showPaywall() : showGate(e.auth === 401);
    if (!t.panel.children.length || t.panel.querySelector('.err')) t.panel.replaceChildren(h('div', { class: 'err' }, e.msg || 'Could not load this tab. Try again.'));

}

// ---------- live pings: small corner notifications ----------
const PK = 'ph-pings';
const PKINDS = [['dev_launch', 'Dev launches a coin'], ['dev_buy', 'Dev buys a coin'], ['trader_buy', 'Trader buys'], ['trader_sell', 'Trader sells']];
const PTAG = { dev_launch: 'Dev launch', dev_buy: 'Dev buy', trader_buy: 'Buy', trader_sell: 'Sell' };
const PCLS = { dev_launch: 'k-launch', dev_buy: 'k-buy', trader_buy: 'k-buy', trader_sell: 'k-sell' };
const loadPrefs = () => { let p = {}; try { p = JSON.parse(localStorage.getItem(PK) || '{}'); } catch {} const d = { on: true }; for (const [k] of PKINDS) d[k] = true; return { ...d, ...p }; };
const savePrefs = (p) => { try { localStorage.setItem(PK, JSON.stringify(p)); } catch {} };
function pingText(e, small) {
  const tok = dex(e.mint, e.symbol || `${e.mint.slice(0, 4)}…${e.mint.slice(-4)}`), sol = e.sol != null ? `${num(e.sol, 2)} SOL` : '';
  const who = h('span', { class: 'who2' }, av(pfpSrc(e.address, e.pfp_v), e.name, e.address, small ? 14 : 18, true), h('b', {}, e.name));
  if (e.kind === 'dev_launch') return [who, ' launched ', tok, sol ? ` and bought ${sol}` : ''];
  if (e.kind === 'trader_sell') return [who, ` sold ${sol} of `, tok];
  return [who, ` bought ${sol} of `, tok];
}
function startPings() {
  window.__stopPings?.();
  const prefs = loadPrefs();
  let last = null, timer = null, live = true, recent = [], open = false;
  const box = h('div', { id: 'toasts', role: 'status', 'aria-live': 'polite' });
  const btn = h('button', { class: 'pingbtn', type: 'button', 'aria-expanded': 'false', 'aria-haspopup': 'true' }, h('i'), 'Pings');
  const pop = h('div', { class: 'pingpop', hidden: '' });
  const wrap = h('span', { class: 'pingwrap' }, btn, pop);
  document.getElementById('who').before(wrap); document.body.append(box);

  const sync = () => { btn.classList.toggle('on', prefs.on); };
  const chk = (key, text) => { const c = h('input', { type: 'checkbox' }); c.checked = !!prefs[key]; c.onchange = () => { prefs[key] = c.checked; savePrefs(prefs); sync(); }; return h('label', {}, c, text); };
  const note = h('div', { class: 'sub', style: 'margin-top:8px', hidden: '' }, 'Live pings are not switched on for this site yet.');
  const rec = h('div', { class: 'rec' });
  pop.append(chk('on', 'Show pings'), h('h4', {}, 'Notify me when'), ...PKINDS.map(([k, l]) => chk(k, l)), note, h('h4', {}, 'Recent'), rec);
  const drawRec = () => { // only the list refreshes, so a checkbox is never replaced while it is being clicked
    note.hidden = live;
    rec.replaceChildren(...(recent.length ? [...recent].reverse().map((e) => h('div', {}, h('span', { class: `pill pk-${e.kind === 'trader_sell' ? 'sell' : e.kind === 'dev_launch' ? 'launch' : 'buy'}` }, PTAG[e.kind]), ' ', pingText(e, true), ' ', h('span', { class: 'sub' }, ago(e.ts)))) : [h('div', {}, 'Nothing yet.')]));
  };
  const setOpen = (v) => { open = v; pop.hidden = !v; btn.setAttribute('aria-expanded', String(v)); if (v) drawRec(); };
  btn.onclick = () => setOpen(!open);
  const outside = (e) => { if (open && !wrap.contains(e.target)) setOpen(false); };
  const esc = (e) => { if (e.key === 'Escape' && open) { setOpen(false); btn.focus(); } };
  document.addEventListener('click', outside); document.addEventListener('keydown', esc);

  function toast(e) {
    let t; const kill = () => { clearTimeout(t); el.remove(); };
    const arm = (ms) => { clearTimeout(t); t = setTimeout(kill, ms); };
    const x = h('button', { class: 'x', type: 'button', 'aria-label': 'Dismiss', onclick: kill }, '×');
    const el = h('div', { class: `toast ${PCLS[e.kind] || ''}` }, h('span', { class: 'coin' }, av(e.image, e.symbol || e.mint, e.mint, 38)), h('div', {}, h('span', { class: 'tg' }, PTAG[e.kind] || 'Ping'), pingText(e)), x);
    el.onmouseenter = () => clearTimeout(t); el.onmouseleave = () => arm(3000);
    box.append(el); while (box.children.length > 4) box.firstChild.remove();
    arm(8000);
  }
  function summary(n) {
    const el = h('div', { class: 'toast' }, h('div', {}, h('span', { class: 'tg' }, 'Pings'), `+${n} more. Open Pings to see them.`), h('button', { class: 'x', type: 'button', 'aria-label': 'Dismiss', onclick: () => el.remove() }, '×'));
    box.append(el); setTimeout(() => el.remove(), 8000);
  }
  async function poll() {
    if (document.hidden) return;
    try {
      const d = await api('/api/dash/events' + (last == null ? '' : `?after=${last}`));
      live = d.live !== false;
      if (last == null) { recent = d.events.slice(-15); last = d.latest; }
      else {
        last = d.events.length ? d.events[d.events.length - 1].id : Math.max(last, d.latest);
        recent = recent.concat(d.events).slice(-15);
        const show = prefs.on ? d.events.filter((e) => prefs[e.kind]) : [];
        show.slice(-3).forEach(toast);
        if (show.length > 3) summary(show.length - 3);
      }
      if (open) drawRec();
    } catch (e) { if (e.auth) stop(); }
  }
  const onVis = () => { if (!document.hidden) poll(); };
  document.addEventListener('visibilitychange', onVis);
  function stop() { clearInterval(timer); document.removeEventListener('click', outside); document.removeEventListener('keydown', esc); document.removeEventListener('visibilitychange', onVis); wrap.remove(); box.remove(); }
  window.__stopPings = stop;
  sync(); poll(); timer = setInterval(poll, 5000);
}

// ---------- shared credit meter + top-up ($5 per 1M Helius credits) ----------
async function creditsModal() {

  const close = () => { clearInterval(poll); back.remove(); };

  let poll = null, asset = 'usdc';
  back.append(box); document.body.append(back);
  let c; try { c = await api('/api/dash/credits'); } catch { close(); return; }
  const bar = h('div', { style: 'height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0' }, h('div', { style: `height:100%;width:${Math.min(100, Math.round(c.used / Math.max(1, c.cap) * 100))}%;background:var(--g)` }));
  const out = h('div', {});

  const packBtns = Object.entries(c.packs).map(([k, p]) => { const b = h('button', { type: 'button', class: 'btn ghost', style: 'padding:8px 14px' }, `$${p.usd} · ${kf(p.credits)} credits`); b.onclick = () => buy(k, b); return b; });
  const assetBtns = ['usdc', 'sol'].map((a) => { const b = h('button', { type: 'button', class: 'btn ghost', style: 'padding:6px 12px;font-size:13px', 'aria-pressed': String(a === asset) }, a.toUpperCase()); b.onclick = () => { asset = a; assetBtns.forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; return b; });
  async function buy(plan, btn) {
    btn.disabled = true; msg.textContent = '';

      const r = await fetch('/api/billing/invoice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ asset, plan }) });
      const inv = await r.json(); if (!r.ok) throw new Error(inv.error || 'Could not create the invoice.');
      const unit = inv.asset === 'usdc' ? 'USDC' : 'SOL', status = h('span', {}, 'Waiting for your payment…');
      const cp = (v, b) => { b.onclick = () => navigator.clipboard?.writeText(v).then(() => { b.textContent = 'Copied'; }).catch(() => {}); return b; };
      out.replaceChildren(h('div', { class: 'sub' }, 'Send exactly'), h('div', { style: 'font:600 22px var(--head)' }, `${inv.amount} ${unit}`), cp(inv.amount, h('button', { type: 'button', class: 'btn ghost', style: 'padding:4px 10px;font-size:12px' }, 'Copy amount')),
        h('div', { class: 'sub', style: 'margin-top:10px' }, 'To this Solana address'), h('div', { style: 'word-break:break-all;font-size:13px' }, inv.address), cp(inv.address, h('button', { type: 'button', class: 'btn ghost', style: 'padding:4px 10px;font-size:12px' }, 'Copy address')),
        h('p', {}, h('a', { class: 'btn ghost', href: inv.link }, 'Open in wallet app')), h('p', { class: 'sub' }, 'The extra digits identify your payment, so please do not round. It is detected automatically within about a minute.'), status);
      clearInterval(poll);
      poll = setInterval(async () => { try { const st = await api(`/api/billing/invoice/${encodeURIComponent(inv.id)}`); if (st.status === 'paid') { clearInterval(poll); status.textContent = 'Thank you! Credits added.'; setTimeout(() => { close(); location.reload(); }, 1500); } } catch {} }, 5000);
    } catch (e) { msg.textContent = e.message; } finally { btn.disabled = false; }
  }
  box.append(h('h2', { style: 'margin:0 0 6px' }, 'Site credits'),
    h('p', { class: 'sub' }, 'The dashboard runs on a shared Helius credit budget. Today the site has used ', h('b', {}, kf(c.used)), ' of ', h('b', {}, kf(c.cap)), '.'), bar,
    h('p', { class: 'sub' }, `Bonus pool from supporters: ${kf(c.bonus)} credits. It switches on only after the daily budget runs out, so the site stays live.${c.donated_usd ? ` Members chipped in $${num(c.donated_usd, 0)} in the last 30 days.` : ''}`),
    h('h3', { style: 'margin:16px 0 8px' }, 'Add credits · $5 per 1M'), h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px' }, assetBtns), h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, packBtns), msg, out,

async function init() {
  const me = await fetch('/api/me').then((r) => r.json()).catch(() => ({}));
  if (!me.name) return showGate(true);
  ME = me;
  if (!me.paid) return me.reason === 'not_member' ? showGate(false) : showPaywall();
  if (location.hash === '#renew' && me.via === 'paid') return showPaywall(true);
  const refBtn = h('button', { type: 'button', class: 'btn ghost', style: 'padding:6px 14px;font-size:13px', title: 'Copy your referral link' }, 'Refer a friend');
  refBtn.onclick = async () => { try { const r = await api('/api/dash/referral'); const link = location.origin + r.path; copy(link, refBtn); refBtn.title = `You get ${r.reward_days} free days when a friend pays. Joined: ${r.joined}, paid: ${r.paid}`; } catch {} };
  const credBtn = h('button', { type: 'button', class: 'btn ghost', style: 'padding:6px 14px;font-size:13px', title: 'Shared Helius credit budget that keeps the dashboard running' }, 'Credits');
  credBtn.onclick = () => creditsModal();
  document.getElementById('who').append(credBtn, ' ', refBtn, ` ${me.name} · `, h('a', { href: '/logout' }, 'Sign out'));
  api('/api/dash/credits').then((c) => { credBtn.textContent = `Credits ${Math.round(Math.max(0, c.cap - c.used + c.bonus) / 1000)}k left`; }).catch(() => {});
  for (const t of TABS) {
    t.btn = h('button', { role: 'tab', id: `t-${t.id}`, 'aria-controls': `p-${t.id}`, onclick: () => select(t.id) }, t.label);
    t.panel = h('section', { role: 'tabpanel', id: `p-${t.id}`, 'aria-labelledby': `t-${t.id}`, hidden: '' });
    tabsEl.append(t.btn); panels.append(t.panel);
  }
  tabsEl.onkeydown = (e) => { const i = TABS.indexOf(current), n = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null; if (n == null) return; e.preventDefault(); const t = TABS[(n + TABS.length) % TABS.length]; select(t.id); t.btn.focus(); };
  select(TABS.find((t) => t.id === location.hash.slice(1))?.id || TABS[0].id);
  setInterval(() => { if (!document.hidden && current) refresh(current); }, 60000); // live refresh
  startPings();

}
